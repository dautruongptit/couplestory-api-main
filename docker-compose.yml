version: '3.9'
services:
  couplestory-api:
    build: .
    image: couplestory-api:latest
    container_name: couplestory-api
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      - DB_HOST=${DB_HOST:-postgres-main}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:8091}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - UPLOADS_DIR=/app/uploads
    volumes:
      - uploads_data:/app/uploads
    networks:
      - shared-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8087/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  uploads_data:

networks:
  shared-network:
    external: true
