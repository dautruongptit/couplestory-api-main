spring:
  application:
    name: couplestory-api

  # Redis disabled for local dev
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

  mail:
    host: smtp.example.com
    port: 587
    username: your-email
    password: your-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8087

app:
  cookie-secure: false # local dev runs over plain HTTP
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8091}

jwt:
  secret: ${JWT_SECRET:e1v1uRMJlueVdOEY+GEtBgQJqsKhtC9fBMiBMxO/m0H9rFEVchXitMjwQvsSuYXr}
  expiration: 14400000 # 4 hours - matches application.yml, see its comment
